services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Ollama runs NATIVELY on the host for this setup (Windows + NVIDIA GPU) —
  # not in Docker. Getting GPU passthrough working for a containerized Ollama
  # on Windows needs the NVIDIA Container Toolkit configured for WSL2, which
  # is extra setup for no benefit when a native install already has GPU
  # access for free. Backend reaches it via host.docker.internal (see .env).
  #
  # On Linux this trade-off flips — Docker GPU passthrough is simpler there.
  # If you ever move this stack to Linux, uncomment the block below, remove
  # `ollama_data` from being commented in the volumes section, and change
  # OLLAMA_HOST back to http://ollama:11434 in .env.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  # Node.js companion service — Baileys itself is Node-only. Only matters
  # once WHATSAPP_PROVIDER=baileys in .env; otherwise it just sits idle.
  #
  # No host port published on purpose: backend reaches this over the
  # internal Docker network (http://baileys-bridge:3000, see BAILEYS_BRIDGE_URL
  # in .env), and /send now requires the shared secret regardless — but there's
  # no reason to also expose it to the host/LAN, where anything on the same
  # network could otherwise reach it directly.
  baileys-bridge:
    build:
      context: ../baileys-bridge
    environment:
      BACKEND_URL: http://backend:8000
      AUTH_DIR: /app/auth_info
    env_file:
      - ../.env # picks up WHATSAPP_WEBHOOK_SECRET — must match the backend's
    depends_on:
      - backend
    volumes:
      - baileys_auth:/app/auth_info # session credentials — survives restarts, never commit this

volumes:
  pgdata:
  # ollama_data:  # only needed if you switch back to a dockerized Ollama (see above)
  baileys_auth:
